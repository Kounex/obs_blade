[package]
name = "obs-blade-bridge"
version = "0.3.0"
edition = "2024"
description = "OBS Blade Remote bridge core: links OBS's local websocket to the OBS Blade relay"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "obb"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "obb"
path = "src/bin/obb.rs"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
env_logger = "0.11.11"

[profile.release]
lto = "thin"
strip = "debuginfo"
