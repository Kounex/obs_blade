# OBS Blade Remote (desktop/): the bridge core (Rust), the OBS plugin and
# the standalone tray app, per OS, as installers (artifacts). A tag
# `remote-v<version>` (desktop/version.sh) also publishes them as release
# v<version> of Kounex/obs-blade-remote - its own repo, so
# releases/latest/download/<file> links stay stable (the FOSS APK holds
# "Latest" here).
name: desktop

on:
  push:
    branches: [master]
    tags: ["remote-v*"]
    paths: ["desktop/**", "!desktop/**/*.md", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        working-directory: desktop/core
        run: cargo test --lib

      - name: Core (static library)
        working-directory: desktop/core
        run: cargo build --release --lib

      # First configure downloads OBS sources, obs-deps and Qt6 into .deps
      - name: Plugin
        working-directory: desktop/plugin
        run: |
          cmake --preset windows-x64
          cmake --build --preset windows-x64 --config RelWithDebInfo
          cmake --install build_x64 --config RelWithDebInfo --prefix "$env:RUNNER_TEMP/plugin"

      # Against the same Qt6 OBS ships (obs-deps)
      - name: Standalone
        working-directory: desktop/standalone
        run: |
          $qt = (Get-ChildItem ../plugin/.deps -Directory -Filter 'obs-deps-qt6-*' | Select-Object -First 1).FullName
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$qt"
          cmake --build build --config Release
          $out = "$env:RUNNER_TEMP/standalone/OBS Blade Remote"
          New-Item -ItemType Directory -Force $out, "$out/platforms", "$out/styles" | Out-Null
          Copy-Item build/Release/obs-blade-remote.exe $out
          foreach ($dll in 'Qt6Core', 'Qt6Gui', 'Qt6Widgets') { Copy-Item "$qt/bin/$dll.dll" $out }
          Copy-Item "$qt/plugins/platforms/qwindows.dll" "$out/platforms"
          # Release builds only (obs-deps ships the debug "...d.dll" next to them)
          Get-ChildItem "$qt/plugins/styles/*.dll" | Where-Object Name -notlike '*d.dll' | Copy-Item -Destination "$out/styles"
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize

      # Inno Setup (preinstalled on the runner); unsigned for now
      - name: Installers
        shell: bash
        run: |
          version=$(desktop/version.sh)
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          out="$RUNNER_TEMP/out"
          cd desktop/windows
          "$iscc" -Q "-DVersion=$version" "-DSourceDir=$RUNNER_TEMP/standalone/OBS Blade Remote" "-DOutputDir=$out" standalone.iss
          "$iscc" -Q "-DVersion=$version" "-DSourceDir=$RUNNER_TEMP/plugin" "-DOutputDir=$out" plugin.iss
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: obs-blade-remote-windows-x64
          path: ${{ runner.temp }}/out

  # The standalone as an AppImage (x86_64, Qt inside). Built on the oldest
  # supported Ubuntu: the AppImage needs its glibc (2.35) or newer - SteamOS,
  # current Ubuntu / Fedora / Arch are newer. The plugin for Linux comes
  # later (a Flatpak OBS needs a Flatpak extension).
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt6
        run: sudo apt-get update -q && sudo apt-get install -yq qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev

      - name: Core tests
        working-directory: desktop/core
        run: cargo test --lib

      - name: Core (static library)
        working-directory: desktop/core
        run: ./build-lib.sh

      - name: Standalone
        working-directory: desktop/standalone
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          mkdir -p "$RUNNER_TEMP/out"
          linux/appimage.sh build "$RUNNER_TEMP/out/OBS-Blade-Remote-x86_64.AppImage"

      # Starts on a virtual X server (the bundled xcb platform) and logs its
      # start line
      - name: Smoke test
        run: |
          sudo apt-get install -yq xvfb
          app="$RUNNER_TEMP/out/OBS-Blade-Remote-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 15 "$app" --background || [ $? -eq 124 ]
          grep "started (core" ~/.config/obs-blade-remote/standalone.log

      - uses: actions/upload-artifact@v4
        with:
          name: obs-blade-remote-linux-x86_64
          path: ${{ runner.temp }}/out

  # Universal (arm64 + x86_64). With the signing secrets (not on pull
  # requests from forks): Developer ID signed, notarized, stapled - the
  # plugin as .pkg (into ~/Library/Application Support/obs-studio/plugins),
  # the standalone as .dmg. Without them: ad hoc signed, not notarized.
  macos:
    runs-on: macos-15
    env:
      SIGNING: ${{ secrets.MACOS_DEVID_APP_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Core tests
        working-directory: desktop/core
        run: cargo test --lib

      - name: Core (universal static library)
        working-directory: desktop/core
        run: ./build-lib.sh

      - name: Signing keychain
        if: env.SIGNING == 'true'
        env:
          APP_P12: ${{ secrets.MACOS_DEVID_APP_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.MACOS_DEVID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in "$APP_P12" "$INSTALLER_P12"; do
            echo "$p12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          done
          rm "$RUNNER_TEMP/identity.p12"
          # Apple's Developer ID intermediate, for the chain
          curl -sSfo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          app=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          installer=$(security find-identity -v -p basic "$keychain" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)
          [ -n "$app" ] && [ -n "$installer" ] || { echo "identities missing"; exit 1; }
          echo "CODESIGN_IDENT=$app" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENT=$installer" >> "$GITHUB_ENV"

      # First configure downloads OBS sources, obs-deps and Qt6 into .deps;
      # CODESIGN_IDENT (from the keychain step) makes Xcode sign with the
      # hardened runtime and a timestamp (cmake/macos/xcode.cmake)
      - name: Plugin
        working-directory: desktop/plugin
        run: |
          cmake --preset macos
          cmake --build --preset macos --config Release
          cmake --install build_macos --config Release --prefix "$RUNNER_TEMP/plugin"
          mkdir -p "$RUNNER_TEMP/out"
          if [ "$SIGNING" = true ]; then
            productsign --sign "$INSTALLER_IDENT" "$RUNNER_TEMP/plugin/obs-blade-remote.pkg" "$RUNNER_TEMP/out/obs-blade-remote-plugin-macos.pkg"
            ../notarize.sh "$RUNNER_TEMP/out/obs-blade-remote-plugin-macos.pkg" "$RUNNER_TEMP/notary.p8" \
              "${{ secrets.MACOS_NOTARY_KEY_ID }}" "${{ secrets.MACOS_NOTARY_ISSUER_ID }}"
          else
            cp "$RUNNER_TEMP/plugin/obs-blade-remote.pkg" "$RUNNER_TEMP/out/obs-blade-remote-plugin-macos.pkg"
          fi

      - name: Standalone
        working-directory: desktop/standalone
        run: |
          qt=$(ls -d "$PWD"/../plugin/.deps/obs-deps-qt6-* | head -1)
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$qt" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j
          dmg="$RUNNER_TEMP/out/OBS-Blade-Remote-macos.dmg"
          macos/package.sh "build/OBS Blade Remote.app" "$qt" "$dmg" "${CODESIGN_IDENT:--}"
          if [ "$SIGNING" = true ]; then
            ../notarize.sh "$dmg" "$RUNNER_TEMP/notary.p8" \
              "${{ secrets.MACOS_NOTARY_KEY_ID }}" "${{ secrets.MACOS_NOTARY_ISSUER_ID }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: obs-blade-remote-macos
          path: ${{ runner.temp }}/out

      - name: Remove the signing keychain
        if: always() && env.SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  release:
    if: startsWith(github.ref, 'refs/tags/remote-v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: obs-blade-remote-*
          path: dist
          merge-multiple: true

      # Fixed file names: the README / site / app link
      # releases/latest/download/<name>
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.REMOTE_RELEASES_TOKEN }}
        run: |
          version=$(desktop/version.sh "$GITHUB_REF_NAME")
          notes="desktop/release-notes/$version.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          for file in OBS-Blade-Remote-macos.dmg obs-blade-remote-plugin-macos.pkg \
              OBS-Blade-Remote-windows-x64-setup.exe obs-blade-remote-plugin-windows-x64-setup.exe \
              OBS-Blade-Remote-x86_64.AppImage; do
            [ -f "dist/$file" ] || { echo "missing dist/$file"; ls -la dist; exit 1; }
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "v$version" dist/* -R Kounex/obs-blade-remote --target main \
            --title "OBS Blade Remote $version" --notes-file "$notes"
