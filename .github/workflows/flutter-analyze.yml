name: flutter analyze

# Flutter comes from the .flutter submodule (the pinned SDK, same as the
# FOSS release). The baseline has infos/warnings - errors fail the run.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Flutter SDK (.flutter submodule)
        run: git submodule update --init .flutter
      - run: .flutter/bin/flutter config --no-analytics
      - run: .flutter/bin/flutter pub get
      # The app only: tool/* holds standalone Dart packages with their
      # own pubspecs (not resolved here)
      - run: .flutter/bin/flutter analyze --no-fatal-infos --no-fatal-warnings lib test integration_test

  # The FOSS build (docs/foss-build.md) must keep compiling: a new store
  # SDK import on master needs a stand-in in tool/foss/overlay/
  foss:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Flutter SDK (.flutter submodule)
        run: git submodule update --init .flutter
      - run: .flutter/bin/flutter config --no-analytics
      - name: FOSS UI tests (regular tree, FOSS define)
        run: |
          .flutter/bin/flutter pub get
          .flutter/bin/flutter test --dart-define=OBS_BLADE_FOSS=true test/foss/
      - name: Strip the store SDKs
        run: tool/foss/prepare.sh
      - name: Analyze the FOSS tree
        run: |
          .flutter/bin/flutter pub get
          .flutter/bin/flutter analyze lib --no-fatal-infos --no-fatal-warnings
