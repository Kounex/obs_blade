# From it-env/templates/container-image/image-caller.example.yml (see its README).
name: image kick-events

on:
  push:
    branches: [master]
    paths: ["tool/kick_events_relay/**", "!tool/kick_events_relay/**/*.md"]
  pull_request:
    paths: ["tool/kick_events_relay/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version step
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: write

concurrency:
  group: image-kick-events-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      image: kick-events
      context: tool/kick_events_relay
      tag_prefix: kick-events-v
      bump: ${{ inputs.bump || 'patch' }}
      push: ${{ github.event_name != 'pull_request' }}
      file: tool/kick_events_relay/Containerfile
      test_target: test
      release: false

  automerge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge patch / digest-only bumps and publish
        # Only a real semver-patch, or a Docker bump whose tag stayed the same
        # (digest-only = upstream rebuilt the base). Grouped PRs report no
        # update-type at all, so they never qualify and wait for a human.
        if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' && (
            steps.meta.outputs.update-type == 'version-update:semver-patch' ||
            contains(github.event.pull_request.head.ref, '/patches-') || (
              steps.meta.outputs.package-ecosystem == 'docker' &&
              steps.meta.outputs.new-version != '' &&
              steps.meta.outputs.previous-version == steps.meta.outputs.new-version))
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR" --squash --delete-branch
          gh workflow run image-kick-events.yml --ref "${{ github.event.repository.default_branch }}" -R "$GITHUB_REPOSITORY"
