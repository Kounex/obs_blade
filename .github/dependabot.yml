version: 2
updates:
  - package-ecosystem: docker
    directories: ["/tool/kick_auth_proxy", "/tool/kick_events_relay"]
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories: ["/tool/kick_events_relay"]
    schedule:
      interval: weekly
    groups:
      patches:
        update-types: ["patch"]
        patterns: ["*"]
