<!doctype html>
<!-- Store-screenshot demo art: transparent stream overlay (name plate +
     goal bar) for the Gameplay scene. 1920x1080, transparent. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
               font-family: "Avenir Next", "Helvetica Neue", sans-serif; color: #fff; }
  .cam { position: absolute; left: 1466px; top: 620px; width: 420px; height: 236px; border-radius: 22px;
         border: 5px solid #ff4fd8; box-shadow: 0 0 30px rgba(255, 79, 216, .7); }
  .plate { position: absolute; left: 1466px; top: 872px; width: 430px; padding: 14px 22px; box-sizing: border-box;
           border-radius: 16px; background: rgba(10, 4, 26, .82); border: 2px solid rgba(61, 232, 255, .6); }
  .plate b { font-size: 34px; font-weight: 900; letter-spacing: 2px; }
  .plate span { display: block; font-size: 20px; opacity: .8; margin-top: 2px; font-weight: 600; }
  .goal { position: absolute; left: 60px; top: 190px; width: 360px; padding: 14px 18px; box-sizing: border-box;
          border-radius: 14px; background: rgba(10, 4, 26, .72); font-weight: 700; font-size: 20px; }
  .goal .bar { margin-top: 10px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; }
  .goal .bar i { display: block; width: 78%; height: 100%; background: linear-gradient(90deg, #ff4fd8, #3de8ff); }
</style>
</head>
<body>
<div class="cam"></div>
<div class="plate"><b>NOVARUSH</b><span>Neon Circuit · road to #1</span></div>
<div class="goal">SUB GOAL · 78 / 100<div class="bar"><i></i></div></div>
</body>
</html>
